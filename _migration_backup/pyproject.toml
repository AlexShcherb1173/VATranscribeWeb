[project]
name = "vatranscribe-web"
version = "0.1.0"
description = "Commercial SaaS/Web backend and core packages for VATranscribe."
requires-python = ">=3.11"
dependencies = []

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "apps/api/tests",
    "apps/worker/tests"
]
pythonpath = [
    ".",
    "apps/api",
    "apps/worker",
    "packages/core"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

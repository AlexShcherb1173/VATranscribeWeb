name: Web CI

on:
  push:
    branches:
      - develop
      - main
      - "feature/**"
  pull_request:

jobs:
  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --include=optional --no-audit --no-fund

      - name: Ensure Rollup native binary

        shell: bash

        run: |

          set -euo pipefail

          ROLLUP_VERSION="$(node -p 'require("./node_modules/rollup/package.json").version')"

          npm install --no-save --package-lock=false --include=optional --no-audit --no-fund "@rollup/rollup-linux-x64-gnu@${ROLLUP_VERSION}"

          node -e 'require("@rollup/rollup-linux-x64-gnu"); console.log("ROLLUP_NATIVE_GNU_OK")'

      - name: Build marketing
        run: npm run build:marketing

      - name: Build web app
        run: npm run build:web

      - name: Validate production compose config
        run: docker compose -f docker-compose.yml -f infra/compose/docker-compose.prod.yml config

name: Production Deploy

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Git ref/tag/branch to deploy"
        required: true
        default: "main"
      run_deploy:
        description: "Set to true to run remote deploy"
        required: true
        default: "false"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: pytest -v
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --include=optional --no-audit --no-fund
      - run: npm run build:frontend
      - run: docker compose -f docker-compose.yml -f infra/compose/docker-compose.prod.yml config
  deploy:
    runs-on: ubuntu-latest
    needs: verify
    if: ${{ inputs.run_deploy == 'true' }}
    environment:
      name: production
    steps:
      - name: Run remote deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PRODUCTION_SSH_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_SSH_PORT || '22' }}
          script_stop: true
          script: |
            cd ${{ secrets.PRODUCTION_PROJECT_ROOT }}
            RUNTIME_ENV_FILE=${{ secrets.PRODUCTION_RUNTIME_ENV_FILE }} \
            GIT_REF=${{ inputs.git_ref }} \
            SMOKE_BASE_URL=${{ secrets.PRODUCTION_SMOKE_BASE_URL }} \
            bash ./infra/deploy/deploy.sh

server {
    listen 80;
    server_name _;
    absolute_redirect off;

    charset utf-8;
    client_max_body_size 1024m;

    gzip on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' http://localhost:* http://127.0.0.1:* https://api.vatranscribe.ru; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /app {
        return 308 /app/;
    }

    location ^~ /app/ {
        alias /usr/share/nginx/html/web/;
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(auth|dashboard|billing)(/.*)?$ {
        root /usr/share/nginx/html/web;
        try_files /index.html =404;
    }

    location / {
        root /usr/share/nginx/html/marketing;
        index index.html;
        try_files $uri/index.html $uri $uri/ /index.html;
    }
}
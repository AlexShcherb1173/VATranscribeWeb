name: Backend CI

on:
  push:
    branches:
      - develop
      - main
      - "feature/**"
  pull_request:

jobs:
  docker-api-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install targeted test dependency
        run: python -m pip install "pytest>=8.3.0,<9.0.0"

      - name: Validate deployment filesystem regressions
        run: |
          python -m pytest \
            tests/security/test_release_activation_filemode_static.py \
            tests/security/test_backup_runtime_env_propagation_static.py \
            tests/security/test_backup_restore_drill_static.py \
            tests/security/test_release_failure_evidence_capture.py \
            tests/security/test_deploy_api_readiness_gate.py \
            -q

      - name: Prepare CI environment file

        shell: bash

        run: |

          set -euo pipefail

          if [[ -f .env.example ]]; then

            cp .env.example .env

          else

            : > .env

          fi

          test -f .env

          echo "CI_ENV_FILE_READY"

      - name: Validate docker compose config
        run: docker compose config

      - name: Build API image
        run: docker compose build api
